services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: readytogo_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "${APP_NAME:-ReadyToGo Staging}"
      APP_ENV: "${APP_ENV:-staging}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: "${DB_HOST:-127.0.0.1}"
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-readytogo_db}"
      DB_USERNAME: "${DB_USERNAME:-readytogo_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secretpassword}"
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      CACHE_DRIVER: file
    volumes:
      - app_storage:/var/www/html/storage/app/public
    networks:
      - readytogo_net

networks:
  readytogo_net:
    driver: bridge

volumes:
  app_storage:
